name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pyright

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest --cov=lakeloom --cov-report=xml
      # Dependency vulnerability scan (NFR-SEC-17)
      - run: uv run --python ${{ matrix.python-version }} pip-audit
        if: matrix.python-version == '3.12'

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Start the dev stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait --wait-timeout 900
      - name: Contract tests
        run: uv run pytest -m contract -v
      - name: Dump stack logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build multi-arch image (no push) with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          sbom: true
          provenance: true
      - name: Build single-arch image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: lakeloom:ci
      - name: Trivy scan (NFR-SEC-17)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lakeloom:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
